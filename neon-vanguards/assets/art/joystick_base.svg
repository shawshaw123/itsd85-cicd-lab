  <line x1="90" y1="152" x2="90" y2="168" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="90" x2="28" y2="90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="90" x2="168" y2="90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Center marker -->
  <circle cx="90" cy="90" r="8" fill="#38bdf8" fill-opacity="0.25"/>
