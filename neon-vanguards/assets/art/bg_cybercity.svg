<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#180b33"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>
  <!-- Night Sky -->
  <rect width="1280" height="720" fill="url(#nightSky)"/>

  <!-- Distant Stars -->
  <circle cx="120" cy="80" r="1.5" fill="#e0e7ff"/>
  <circle cx="280" cy="140" r="2" fill="#c084fc"/>
  <circle cx="450" cy="60" r="1.5" fill="#e0e7ff"/>
  <circle cx="680" cy="110" r="2.5" fill="#38bdf8"/>
  <circle cx="890" cy="70" r="1.5" fill="#e0e7ff"/>
  <circle cx="1120" cy="130" r="2" fill="#f472b6"/>

  <!-- Giant Cyber Moon -->
  <circle cx="1060" cy="180" r="70" fill="#f43f5e" opacity="0.15"/>
  <circle cx="1060" cy="180" r="55" fill="#f43f5e" opacity="0.3"/>
  <circle cx="1060" cy="180" r="45" fill="#fda4af"/>

  <!-- Background Layer Skyscrapers -->
  <rect x="40" y="320" width="110" height="400" fill="#1e1035"/>
  <rect x="180" y="240" width="140" height="480" fill="#190d2e"/>
  <rect x="360" y="360" width="100" height="360" fill="#201138"/>
  <rect x="500" y="220" width="160" height="500" fill="#180d2c"/>
  <rect x="700" y="300" width="130" height="420" fill="#1e1035"/>
  <rect x="870" y="260" width="140" height="460" fill="#190d2e"/>
  <rect x="1050" y="340" width="180" height="380" fill="#201138"/>

  <!-- Midground Neon Skyscrapers with Glowing Windows -->
  <rect x="110" y="380" width="130" height="340" fill="#2e1065"/>
  <line x1="130" y1="410" x2="220" y2="410" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>
  <line x1="130" y1="440" x2="220" y2="440" stroke="#f43f5e" stroke-width="3" opacity="0.8"/>
  <line x1="130" y1="470" x2="220" y2="470" stroke="#06b6d4" stroke-width="3" opacity="0.8"/>

  <rect x="420" y="310" width="140" height="410" fill="#3b0764"/>
  <!-- Antennas with red beacons -->
  <line x1="490" y1="310" x2="490" y2="240" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="490" cy="240" r="4" fill="#ef4444"/>
  <line x1="440" y1="350" x2="540" y2="350" stroke="#a855f7" stroke-width="4"/>
  <line x1="440" y1="380" x2="540" y2="380" stroke="#38bdf8" stroke-width="4"/>
  <line x1="440" y1="410" x2="540" y2="410" stroke="#a855f7" stroke-width="4"/>

  <rect x="760" y="370" width="170" height="350" fill="#2e1065"/>
  <line x1="790" y1="400" x2="900" y2="400" stroke="#f43f5e" stroke-width="4"/>
  <line x1="790" y1="430" x2="900" y2="430" stroke="#38bdf8" stroke-width="4"/>
  <line x1="790" y1="460" x2="900" y2="460" stroke="#f43f5e" stroke-width="4"/>

  <!-- Holographic Searchlight Beams -->
  <polygon points="260,720 380,0 440,0 280,720" fill="#06b6d4" opacity="0.06"/>
  <polygon points="920,720 780,0 840,0 950,720" fill="#ec4899" opacity="0.06"/>
</svg>

