<svg width="64" height="32" viewBox="0 0 64 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Stock -->
  <rect x="2" y="10" width="16" height="8" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
  <!-- Receiver / Body -->
  <rect x="14" y="6" width="30" height="13" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <!-- Barrel -->
  <rect x="42" y="9" width="16" height="6" rx="2" fill="#475569" stroke="#0f172a" stroke-width="2"/>
  <!-- Flash hider / Muzzle -->
  <rect x="56" y="8" width="5" height="8" rx="2" fill="#0f172a"/>
  <!-- Magazine -->
  <polygon points="26,17 32,17 28,30 22,30" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <!-- Grip / Handle -->
  <polygon points="12,17 18,17 14,27 9,27" fill="#0f172a"/>
  <!-- Scope / Laser Sight -->
  <rect x="20" y="2" width="14" height="5" rx="2" fill="#0284c7" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="33" cy="4.5" r="2" fill="#38bdf8"/>
  <!-- Cartoon Hand holding the grip -->
  <ellipse cx="14" cy="20" rx="4" ry="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
</svg>

