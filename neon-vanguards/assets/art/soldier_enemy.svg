<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Jetpack on back -->
  <rect x="22" y="44" width="22" height="42" rx="8" fill="#475569" stroke="#1e293b" stroke-width="3"/>
  <rect x="26" y="78" width="14" height="16" rx="4" fill="#dc2626"/>
  <ellipse cx="33" cy="98" rx="8" ry="12" fill="#ef4444" opacity="0.9"/>
  <ellipse cx="33" cy="95" rx="5" ry="7" fill="#facc15"/>

  <!-- Body / Tactical Vest -->
  <rect x="42" y="52" width="46" height="42" rx="14" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
  <!-- Armor plating -->
  <rect x="48" y="58" width="34" height="20" rx="6" fill="#991b1b"/>
  <!-- Pouches -->
  <rect x="46" y="82" width="10" height="10" rx="3" fill="#334155"/>
  <rect x="60" y="82" width="10" height="10" rx="3" fill="#334155"/>
  <rect x="74" y="82" width="10" height="10" rx="3" fill="#334155"/>

  <!-- Cartoon Head -->
  <circle cx="68" cy="38" r="28" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
  
  <!-- Red Renegade Combat Beret -->
  <path d="M 38 34 C 42 12, 94 14, 102 28 C 104 36, 44 40, 38 34 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="3"/>
  <!-- Beret Insignia / Skull Badge -->
  <circle cx="56" cy="28" r="5" fill="#facc15" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- Angry Cartoon Eyes -->
  <ellipse cx="64" cy="40" rx="8" ry="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <ellipse cx="80" cy="40" rx="8" ry="9" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <!-- Glowing red cyber pupil on left, determined pupil on right -->
  <circle cx="67" cy="40" r="4.5" fill="#ef4444"/>
  <circle cx="67" cy="40" r="2" fill="#ffffff"/>
  <circle cx="83" cy="40" r="4.5" fill="#0f172a"/>
  <!-- Slanted angry eyebrows -->
  <path d="M 56 32 L 72 36" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round"/>
  <path d="M 88 32 L 74 36" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round"/>

  <!-- Gritted teeth mouth -->
  <rect x="65" y="49" width="16" height="5" rx="2" fill="#ffffff" stroke="#7f1d1d" stroke-width="1.5"/>
  <line x1="73" y1="49" x2="73" y2="54" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- Boots / Legs -->
  <rect x="46" y="94" width="16" height="20" rx="6" fill="#1e293b"/>
  <rect x="68" y="94" width="16" height="20" rx="6" fill="#1e293b"/>
  <ellipse cx="54" cy="114" rx="10" ry="6" fill="#0f172a"/>
  <ellipse cx="76" cy="114" rx="10" ry="6" fill="#0f172a"/>
</svg>

