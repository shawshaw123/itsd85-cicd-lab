  <rect x="46" y="30" width="44" height="14" rx="4" fill="#f59e0b" stroke="#78350f" stroke-width="2"/>
  <rect x="50" y="33" width="36" height="4" rx="2" fill="#fef08a" opacity="0.9"/>
  <!-- Respirator / Gas Filter -->
