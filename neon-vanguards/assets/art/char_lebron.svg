  <rect x="22" y="82" width="18" height="18" rx="4" fill="#eab308"/>
  <ellipse cx="31" cy="104" rx="10" ry="14" fill="#f59e0b" opacity="0.9"/>
  <ellipse cx="31" cy="100" rx="6" ry="8" fill="#fef08a"/>

  <!-- Heavy Blast Armor (Olive / Camo Green) -->
  <rect x="38" y="48" width="54" height="48" rx="16" fill="#365314" stroke="#14532d" stroke-width="4"/>
