<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nebula" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>

  <!-- Deep Cosmos -->
  <rect width="1280" height="720" fill="#030712"/>
  
  <!-- Cosmic Nebula -->
  <rect width="1280" height="720" fill="url(#nebula)"/>

  <!-- Starfield -->
  <circle cx="80" cy="90" r="1.5" fill="#ffffff"/>
  <circle cx="160" cy="220" r="2" fill="#7dd3fc"/>
  <circle cx="280" cy="70" r="1.2" fill="#ffffff"/>
  <circle cx="390" cy="180" r="2.5" fill="#fbcfe8"/>
  <circle cx="520" cy="85" r="1.5" fill="#ffffff"/>
  <circle cx="700" cy="240" r="2" fill="#bae6fd"/>
  <circle cx="810" cy="60" r="1.5" fill="#ffffff"/>
  <circle cx="950" cy="150" r="2" fill="#ffffff"/>
  <circle cx="1060" cy="90" r="1.2" fill="#38bdf8"/>
  <circle cx="1180" cy="210" r="2.5" fill="#fde047"/>
  <circle cx="1220" cy="70" r="1.5" fill="#ffffff"/>
  <circle cx="600" cy="380" r="1.5" fill="#ffffff"/>
  <circle cx="750" cy="420" r="2" fill="#ffffff"/>

  <!-- Giant Ringed Blue Planet -->
  <circle cx="320" cy="260" r="110" fill="url(#planetGrad)"/>
  <!-- Planet Ring System -->
  <ellipse cx="320" cy="260" rx="200" ry="40" fill="none" stroke="#7dd3fc" stroke-width="6" opacity="0.4" transform="rotate(-18 320 260)"/>
  <ellipse cx="320" cy="260" rx="175" ry="32" fill="none" stroke="#bae6fd" stroke-width="3" opacity="0.7" transform="rotate(-18 320 260)"/>

  <!-- Distant Space Station Module Outline -->
  <rect x="880" y="240" width="180" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Solar panels on station -->
  <rect x="800" y="225" width="70" height="70" fill="#0369a1" stroke="#0284c7" stroke-width="2" rx="4"/>
  <rect x="1070" y="225" width="70" height="70" fill="#0369a1" stroke="#0284c7" stroke-width="2" rx="4"/>
  <circle cx="970" cy="260" r="8" fill="#38bdf8" opacity="0.8"/>
</svg>

